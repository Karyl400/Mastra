name: CI

# ⚠️ Les déclencheurs ne visaient que `main`/`master` — or tout le développement de ce projet
# vit sur `refactor/cleanup-20260810`, qui n'est ni l'un ni l'autre. La CI n'avait donc JAMAIS
# tourné sur le code réellement écrit : elle donnait une assurance sans rien valider.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        # `package.json` exige `>=22.13.0` et `scripts/fix-vercel-output.js` force le runtime
        # Vercel à `nodejs22.x`. Tester en 20 validait donc sur une version que le projet
        # déclare non supportée et que la production n'exécute pas.
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint
      run: npm run lint
      
    - name: Typecheck
      run: npm run typecheck
      
    - name: Test
      run: npm run test:unit
      
    - name: Build
      run: npm run build
